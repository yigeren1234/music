<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>三里桥海鲜烧烤 | 悦音</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b0d12;color:#eef1f6;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:20px}
.card{width:100%;max-width:400px;background:#141a24;border-radius:20px;padding:40px 28px;text-align:center;border:1px solid rgba(255,255,255,.08);box-shadow:0 20px 60px rgba(0,0,0,.4)}
.icon{font-size:48px;margin-bottom:18px}
h1{font-size:22px;font-weight:700;margin-bottom:8px}
.meta{color:#8f99ab;font-size:14px;margin-bottom:30px}
.btn-dl{display:block;width:100%;padding:20px;border:none;border-radius:16px;background:linear-gradient(135deg,#e8b45a,#d68a3c);color:#221708;font-size:19px;font-weight:700;text-decoration:none;font-family:inherit;cursor:pointer;transition:.2s;letter-spacing:1px}
.btn-dl:hover{background:#d6a54a;transform:translateY(-2px);box-shadow:0 8px 25px rgba(232,180,90,.35)}
.btn-dl:active{transform:translateY(0)}
.status{color:#5b6472;font-size:13px;margin-top:14px;min-height:18px}
.footer{margin-top:26px;color:#5b6472;font-size:12px}
</style>
</head>
<body>
<div class="card">
<div style="font-size:48px;margin-bottom:18px">🎵</div>
<h1>三里桥海鲜烧烤</h1>
<p class="meta">0.6MB · MP3 · 点击下方按钮立即保存到手机/电脑</p>
<button class="btn-dl" id="dlBtn" data-audio="https://cdn.jsdelivr.net/gh/yigeren1234/music@main/music/mt9bgb72-z29ff.mp3" data-filename="三里桥海鲜烧烤.mp3" onclick="doDownload(this)">⬇ 立即下载</button>
<p class="status" id="dlStatus"></p>
<p class="footer">Powered by 悦音</p></div>
<script>
function doDownload(btn){
  var url=btn.getAttribute("data-audio");
  var name=btn.getAttribute("data-filename");
  var st=document.getElementById("dlStatus");
  btn.disabled=true;st.textContent="正在准备文件…";
  var x=new XMLHttpRequest();
  x.open("GET",url,true);
  x.responseType="blob";
  x.onprogress=function(e){if(e.lengthComputable){var p=Math.round(e.loaded/e.total*100);st.textContent="下载中 "+p+"%";}};
  x.onload=function(){
    if(x.status===200){
      var b=new Blob([x.response],{type:"audio/mpeg"});
      var u=URL.createObjectURL(b);
      var a=document.createElement("a");a.href=u;a.download=name;
      document.body.appendChild(a);a.click();a.remove();
      setTimeout(function(){URL.revokeObjectURL(u)},5000);
      st.textContent="已开始下载 ✓";btn.disabled=false;
    }else{st.textContent="下载失败，请重试";btn.disabled=false;}
  };
  x.onerror=function(){st.textContent="网络错误，请重试";btn.disabled=false;};
  x.send();
}
</script>
</body>
</html>
