<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>山风山风等等我 | 悦音</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b0d12;color:#eef1f6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;padding:20px}
.card{width:100%;max-width:400px;background:#141a24;border-radius:20px;padding:40px 28px;text-align:center;border:1px solid rgba(255,255,255,.08);box-shadow:0 20px 60px rgba(0,0,0,.4)}
.cover{width:80px;height:80px;margin:0 auto 20px;background:linear-gradient(135deg,#1a2a45,#152642);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:36px}
h1{font-size:22px;font-weight:700;margin-bottom:8px;word-break:break-all}
.cat{display:inline-block;padding:3px 14px;border-radius:99px;background:rgba(232,180,90,.15);color:#e8b45a;font-size:13px;margin-bottom:20px}
.meta{color:#8f99ab;font-size:14px;margin-bottom:30px}
.btn-dl{display:block;width:100%;padding:18px;border:none;border-radius:16px;background:linear-gradient(135deg,#e8b45a,#d68a3c);color:#221708;font-size:18px;font-weight:700;text-decoration:none;font-family:inherit;cursor:pointer;transition:.2s}
.btn-dl:hover{background:#d6a54a;transform:translateY(-2px)}
.progress{height:4px;background:rgba(255,255,255,.08);border-radius:2px;margin-top:16px;overflow:hidden;display:none}
.progress-fill{height:100%;background:#e8b45a;border-radius:2px;width:0%}
.footer{margin-top:28px;color:#5b6472;font-size:12px}
</style>
</head>
<body>
<div class="card">
<div class="cover">🎵</div>
<h1>山风山风等等我</h1>
<span class="cat">客户音乐</span>
<p class="meta">3:30 · 3.2MB</p>
<button class="btn-dl" onclick="dl(this)" data-url="https://cdn.jsdelivr.net/gh/yigeren1234/music@main/music/mt9diowv-wqwkf.mp3" data-name="山风山风等等我.mp3">⬇ 下载配音</button>
<div class="progress" id="prog"><div class="progress-fill" id="pf"></div></div>
<audio id="aud" src="https://cdn.jsdelivr.net/gh/yigeren1234/music@main/music/mt9diowv-wqwkf.mp3" preload="none"></audio>
<p class="footer">配音下载后 请到文件夹里查找</p>
</div>
<script>
function dl(btn){
 var url=btn.getAttribute("data-url"),name=btn.getAttribute("data-name");
 btn.style.opacity=".6";btn.innerHTML="正在准备…";
 fetch(url).then(function(r){if(!r.ok)throw new Error(r.status);return r.blob()})
 .then(function(b){var u=URL.createObjectURL(b);var a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(u);a.remove()},3000);btn.style.opacity="1";btn.innerHTML="⬇ 已开始下载";setTimeout(function(){btn.innerHTML="⬇ 下载配音"},2000)})
 .catch(function(e){btn.style.opacity="1";btn.innerHTML="下载失败，点击重试"})}
</script>
</body>
</html>
