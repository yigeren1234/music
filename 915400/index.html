<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>0826桃上茶山配乐版02 | 悦音</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0b0d12;color:#eef1f6;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:20px}
.card{width:100%;max-width:420px;background:#141a24;border:1px solid rgba(255,255,255,.08);border-radius:20px;padding:40px 28px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.4)}
h1{font-size:22px;font-weight:700;margin-bottom:8px;word-break:break-all}
.cat{display:inline-block;padding:4px 16px;border-radius:99px;background:rgba(232,180,90,.15);color:#e8b45a;font-size:13px;margin-bottom:12px}
.meta{color:#8f99ab;font-size:14px;margin-bottom:32px}
.btn-dl{display:block;width:100%;padding:20px;border:none;border-radius:16px;background:linear-gradient(135deg,#e8b45a,#d68a3c);color:#221708;font-size:19px;font-weight:700;font-family:inherit;cursor:pointer;letter-spacing:2px;transition:.2s}
.btn-dl:hover{background:#d6a54a;transform:translateY(-2px);box-shadow:0 10px 30px rgba(232,180,90,.35)}
.btn-dl:active{transform:translateY(0)}
.btn-dl:disabled{opacity:.6;cursor:default;transform:none;box-shadow:none}
.status{margin-top:14px;color:#5b6472;font-size:13px;min-height:18px}
.footer{margin-top:24px;color:#5b6472;font-size:12px}
</style>
</head>
<body>
<div class="card"><div style="font-size:48px;margin-bottom:18px">🎵</div><h1>0826桃上茶山配乐版02</h1><span class="cat">客户配音二</span><p class="meta">1:08 · 1.0 MB</p><button class="btn-dl" id="dlBtn" onclick="doDL()">⬇ 立即下载配音</button><p class="status" id="st"></p><p class="footer">配音下载后 请到文件夹里查找</p></div>
<script>
var CDN="https://cdn.jsdelivr.net/gh/yigeren1234/music@main/music/mt9v7erw-wc0tx.mp3";
var GH="https://api.github.com/repos/yigeren1234/music/contents/music/mt9v7erw-wc0tx.mp3?ref=main";
var NAME="0826桃上茶山配乐版02.mp3";
function getFile(){
 return fetch(CDN,{mode:'cors',cache:'force-cache'}).then(function(r){
  if(r.ok)return r;throw new Error('cdn');
 }).catch(function(){
  return fetch(GH,{headers:{Accept:'application/vnd.github.raw'}});
 });
}
function doDL(){
 var st=document.getElementById('st'),btn=document.getElementById('dlBtn');
 if(btn)btn.disabled=true;
 st.textContent='正在连接…';
 getFile().then(function(r){
  if(!r.ok)throw new Error(r.status);
  var total=Number(r.headers.get('Content-Length'))||0;
  if(!r.body){return r.blob();}
  var reader=r.body.getReader(),chunks=[],got=0;
  function pump(){
   return reader.read().then(function(d){
    if(d.done)return;
    chunks.push(d.value);got+=d.value.length;
    if(total){st.textContent='下载中 '+Math.min(99,Math.round(got/total*100))+'%';}
    else{st.textContent='下载中 '+Math.round(got/1024)+' KB';}
    return pump();
   });
  }
  return pump().then(function(){return new Blob(chunks,{type:'audio/mpeg'});});
 }).then(function(b){
  var u=URL.createObjectURL(b);
  var a=document.createElement('a');
  a.href=u;a.download=NAME;
  document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(u);a.remove()},3000);
  st.textContent='已开始下载 ✓';
  if(btn)btn.disabled=false;
 }).catch(function(e){
  st.textContent='下载失败，请重试';
  if(btn)btn.disabled=false;
 });
}
</script>
</body>
</html>
